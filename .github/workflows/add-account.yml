name: Add Account (Auto)

on:
  workflow_dispatch:
    inputs:
      account_number:
        description: 'Account # (empty = all)'
        required: false
        default: ''
      manual_code:
        description: '2FA code (empty = fetch from Gmail)'
        required: false
        default: ''
      force_all:
        description: 'Overwrite existing FB_COOKIES_N'
        required: false
        default: 'false'
        type: boolean

jobs:
  add:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pynacl
          playwright install chromium
          playwright install-deps chromium

      - name: Run login
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FB_ACCOUNTS: ${{ secrets.FB_ACCOUNTS }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          ACCOUNT_NUM: ${{ inputs.account_number }}
          MANUAL_CODE: ${{ inputs.manual_code }}
          FORCE_ALL: ${{ inputs.force_all }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python add_account.py
