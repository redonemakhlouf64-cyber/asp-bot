name: Add Account (Verify Cookies)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Run verifier
        env:
          FB_COOKIES_1: ${{ secrets.FB_COOKIES_1 }}
          FB_COOKIES_2: ${{ secrets.FB_COOKIES_2 }}
          FB_COOKIES_3: ${{ secrets.FB_COOKIES_3 }}
          FB_COOKIES_4: ${{ secrets.FB_COOKIES_4 }}
          FB_COOKIES_5: ${{ secrets.FB_COOKIES_5 }}
        run: python add_account.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-debug
          path: |
            verify_*.png
          if-no-files-found: ignore
          retention-days: 7
