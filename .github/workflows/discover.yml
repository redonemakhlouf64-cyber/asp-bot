name: Group Discovery

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run discovery
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES_1 }}
        run: python discover.py

      - name: Commit groups.txt
        run: |
          git config user.name "asp-bot"
          git config user.email "bot@asp.local"
          git add groups.txt || true
          git diff --cached --quiet || git commit -m "discovery update"
          git push || true
