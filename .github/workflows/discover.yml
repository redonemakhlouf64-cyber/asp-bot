name: Group Discovery

on:
  workflow_dispatch:
    inputs:
      account_num:
        description: 'Account number (matches FB_COOKIES_N secret)'
        type: string
        default: '1'
      max_per_keyword:
        description: 'Max groups per keyword'
        type: string
        default: '20'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Run discover
        env:
          ACCOUNT_NUM: ${{ inputs.account_num }}
          MAX_PER_KEYWORD: ${{ inputs.max_per_keyword }}
          FB_COOKIES_1: ${{ secrets.FB_COOKIES_1 }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
        run: python discover.py

      - name: Commit groups.txt
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f groups.txt ]; then
            git add groups.txt
            git diff --cached --quiet || git commit -m "chore: update groups.txt [skip ci]"
            git push || true
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-debug
          path: |
            discover_*.png
            groups.txt
          if-no-files-found: ignore
          retention-days: 7
