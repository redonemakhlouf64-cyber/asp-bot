name: Auto Joiner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cookies from secret
        run: |
          mkdir -p cookies
          echo '${{ secrets.COOKIES_ZIP_B64 }}' | base64 -d > cookies.zip
          unzip -o cookies.zip -d cookies/
          rm cookies.zip

      - name: Run joiner
        run: python joiner.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git push || true
