name: Auto Poster

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force posting even if already posted"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  post:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        acc_num: [1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m playwright install chromium

      - name: Run poster
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FB_ACCOUNTS: ${{ secrets.FB_ACCOUNTS }}

          FB_COOKIES: ${{ secrets.FB_COOKIES_1 }}
          FB_COOKIES_1: ${{ secrets.FB_COOKIES_1 }}

          CONTENT: ${{ secrets.CONTENT }}
          COMMENTS: ${{ secrets.COMMENTS }}
          IMAGES: ${{ secrets.IMAGES }}

          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}

          PROXY: ${{ secrets.PROXY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}

          ACC_NUM: ${{ matrix.acc_num }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'true' }}
        run: |
          python poster.py

      - name: Upload failure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure_acc1.png
          if-no-files-found: ignore

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update poster state"
            git push
          fi
