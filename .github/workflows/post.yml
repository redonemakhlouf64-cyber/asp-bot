name: Auto Poster

on:
  workflow_dispatch:
    inputs:
      account_num:
        description: 'Account number (matches FB_COOKIES_N secret)'
        type: string
        default: '1'
      force_all:
        description: 'Force post even if recently posted'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
   runs-on: ubuntu-22.04 
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Read content
        id: content
        run: |
          if [ -f content.txt ]; then
            {
              echo 'CONTENT<<POST_EOF'
              cat content.txt
              echo 'POST_EOF'
            } >> $GITHUB_ENV
          fi

      - name: Run poster
        env:
          ACCOUNT_NUM: ${{ inputs.account_num }}
          FORCE_ALL: ${{ inputs.force_all }}
          AUTO_REMOVE_FAILED: 'true'
          FB_COOKIES_1: ${{ secrets.FB_COOKIES_1 }}
          FB_COOKIES_2: ${{ secrets.FB_COOKIES_2 }}
          FB_COOKIES_3: ${{ secrets.FB_COOKIES_3 }}
        run: python poster.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ inputs.account_num }}
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated groups
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add groups.txt failed_groups.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: remove failed groups [skip ci]"
            git push
          fi
