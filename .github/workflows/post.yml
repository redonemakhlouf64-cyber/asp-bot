name: Auto Poster

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force posting even if recently posted"
        default: "true"
        type: choice
        options: ["true", "false"]
  schedule:
    - cron: "0 */6 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m playwright install chromium

      - name: Run poster
        env:
          FB_ACCOUNTS:  ${{ secrets.FB_ACCOUNTS }}
          FB_COOKIES_1: ${{ secrets.FB_COOKIES_1 }}
          CONTENT:      ${{ secrets.CONTENT }}
          COMMENTS:     ${{ secrets.COMMENTS }}
          GH_PAT:       ${{ secrets.GH_PAT }}
          GMAIL_EMAIL:  ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          PROXY:        ${{ secrets.PROXY }}
          PROXY_URL:    ${{ secrets.PROXY_URL }}
          FORCE_ALL:    ${{ github.event.inputs.force_all || 'true' }}
        run: |
          python poster.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-logs
          path: |
            *.log
            screenshots/
          retention-days: 7
          if-no-files-found: ignore
