name: Auto Poster

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check cookies & post text
        run: |
          echo "Cookies:" && ls -lh cookies/
          echo "Post text:" && cat post.txt

      - name: Run poster
        run: python poster.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || git commit -m "chore: update posted state [skip ci]"
          git push || true
