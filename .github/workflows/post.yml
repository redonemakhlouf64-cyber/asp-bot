name: Auto Poster

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force posting even if state says already posted"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 */6 * * *"

jobs:
  post:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        acc_num: [1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run poster
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

          # مهم: هادو بجوج باش نغطي أي اسم كيقلب عليه السكريبت
          FB_COOKIES: ${{ secrets.FB_COOKIES_1 }}
          FB_COOKIES_1: ${{ secrets.FB_COOKIES_1 }}

          CONTENT: ${{ secrets.CONTENT }}
          IMAGES: ${{ secrets.IMAGES }}
          COMMENTS: ${{ secrets.COMMENTS }}

          ACC_NUM: ${{ matrix.acc_num }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}

          PROXY: ${{ secrets.PROXY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}

        run: |
          python poster.py

      - name: Commit state
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update poster state"
            git push
          fi
