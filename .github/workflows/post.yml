name: Auto Poster

on:
  workflow_dispatch:
    inputs:
      account_num:
        description: 'Account number (matches FB_COOKIES_N secret)'
        type: string
        default: '1'
      force_all:
        description: 'Force post even if recently posted'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Run poster
        env:
          ACCOUNT_NUM: ${{ inputs.account_num }}
          FORCE_ALL: ${{ inputs.force_all }}
          CONTENT: ${{ secrets.CONTENT }}
          FB_COOKIES_1: ${{ secrets.FB_COOKIES_1 }}
        run: python poster.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-poster-acc${{ inputs.account_num }}
          path: |
            debug_*.png
          if-no-files-found: ignore
          retention-days: 7
